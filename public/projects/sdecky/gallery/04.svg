      <stop offset="0%" stop-color="#2b1f38"/>
      <stop offset="100%" stop-color="#1f2538"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e203f"/>
      <stop offset="100%" stop-color="#4b2b5f"/>
